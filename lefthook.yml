pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,astro,mjs,js,json,jsonc}"
      run: pnpm exec biome format --write {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx,mjs,js}"
      run: pnpm exec biome lint {staged_files}

    - name: typecheck
      glob: "*.{ts,tsx,astro,mjs,js,json}"
      run: pnpm typecheck

pre-push:
  jobs:
    - name: test
      run: pnpm test
